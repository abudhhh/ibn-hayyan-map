<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>خريطة ابن حيان - تعديل الحدود</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,Tahoma,sans-serif;background:#0f172a;color:#e2e8f0;overflow:hidden}
header{background:linear-gradient(135deg,#0f766e,#134e4a);padding:10px 12px;text-align:center}
header h1{font-size:1.02rem}
#map{height:calc(100vh - 168px);width:100%}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:2000;background:#0f172a;border-top:1px solid #334155;padding:8px 10px 14px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{flex:1;min-width:72px;border:0;border-radius:10px;padding:10px 8px;font-size:13px;font-weight:700;color:#fff}
.on{background:#0f766e}
.off{background:#334155}
.warn{background:#b45309}
.sel{display:flex;gap:6px;overflow:auto;margin-bottom:6px;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid #334155;background:#1e293b;color:#e2e8f0;border-radius:999px;padding:7px 12px;font-size:13px}
.chip.active{outline:2px solid #5eead4;background:#134e4a}
.clinic-marker{background:#0f766e;border:3px solid #fff;border-radius:50%;width:18px;height:18px}
.popup-content{direction:rtl;text-align:right;min-width:210px}
.popup-content h3{color:#0f766e;margin-bottom:6px}
.target{background:#f0fdfa;color:#134e4a;padding:6px;border-radius:6px;margin:6px 0}
.status{font-size:11px;color:#5eead4;margin-top:4px;min-height:14px}
</style>
</head>
<body>
<header><h1>خريطة ابن حيان – اسحب النقاط لتعديل الحدود</h1></header>
<div id="map"></div>
<div class="bar">
  <div class="sel" id="chips"></div>
  <div class="row">
    <button class="btn off" id="editBtn" type="button">تعديل: مغلق</button>
    <button class="btn off" id="satBtn" type="button">صور الأقمار</button>
    <button class="btn on" id="saveBtn" type="button">حفظ</button>
    <button class="btn warn" id="resetBtn" type="button">الأصل</button>
  </div>
  <div class="status" id="status">اختر مجمعاً ثم اضغط تعديل واسحب النقاط البيضاء</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='ibn-zones-v3';
const clinic=[25.3100,55.4600];
const base=[
 {id:'aljada',short:'الجادة',name:'مجمع الجادة',color:'#0ea5e9',target:'العائلات الشابة والمهنيون',services:'جلدية وتجميل • أسنان تجميلية • باقات الحمل • فحوصات تنفيذية',polygon:[[25.3236,55.4678],[25.3242,55.4756],[25.3234,55.4818],[25.3202,55.4830],[25.3164,55.4818],[25.3138,55.4786],[25.3132,55.4730],[25.3144,55.4686],[25.3186,55.4672]]},
 {id:'zahia',short:'الزاهية',name:'مجمع الزاهية',color:'#8b5cf6',target:'سكان الفلل الفاخرة',services:'تجميل وليزر • فحوصات تنفيذية • باقات العائلة • أسنان تجميلي',polygon:[[25.3188,55.4496],[25.3192,55.4544],[25.3180,55.4578],[25.3152,55.4586],[25.3116,55.4578],[25.3094,55.4548],[25.3090,55.4508],[25.3106,55.4480],[25.3144,55.4474],[25.3174,55.4482]]},
 {id:'mamsha',short:'الممشى',name:'مجمع الممشى',color:'#ec4899',target:'المهنيون والعائلات الشابة',services:'جلدية وتجميل • أسنان • ليزر • باقات الحمل',polygon:[[25.3102,55.4654],[25.3104,55.4694],[25.3090,55.4704],[25.3066,55.4702],[25.3052,55.4688],[25.3050,55.4662],[25.3064,55.4650],[25.3086,55.4648]]},
 {id:'masaar',short:'مسار',name:'مجمع مسار',color:'#f59e0b',target:'النخبة ورجال الأعمال',services:'فحوصات VIP • تجميل • باقات رجال الأعمال',polygon:[[25.2652,55.5878],[25.2658,55.5944],[25.2646,55.5998],[25.2610,55.6018],[25.2562,55.6014],[25.2526,55.5984],[25.2516,55.5932],[25.2530,55.5884],[25.2578,55.5866],[25.2624,55.5868]]},
 {id:'uni',short:'الجامعة',name:'المدينة الجامعية',color:'#10b981',target:'الأكاديميون والموظفون',services:'فحوصات دورية • طب الأسرة • باقات الحمل',polygon:[[25.3108,55.4724],[25.3120,55.4820],[25.3114,55.4928],[25.3076,55.4968],[25.3018,55.4976],[25.2954,55.4942],[25.2922,55.4870],[25.2918,55.4782],[25.2946,55.4728],[25.3012,55.4712],[25.3072,55.4716]]}
];
let zones=JSON.parse(JSON.stringify(base));
try{const s=localStorage.getItem(KEY); if(s) zones=JSON.parse(s);}catch(e){}
const map=L.map('map',{center:clinic,zoom:14,zoomControl:true});
const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
L.marker(clinic,{icon:L.divIcon({className:'clinic-marker',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
const layers={}; let verts=[]; let edit=false, satOn=false, active='mamsha';
function popup(z){return '<div class="popup-content"><h3>'+z.name+'</h3><div class="target">'+z.target+'</div><p>'+z.services+'</p></div>';}
function draw(){
 Object.values(layers).forEach(p=>map.removeLayer(p));
 zones.forEach(z=>{
  const p=L.polygon(z.polygon,{color:z.color,fillColor:z.color,fillOpacity:.3,weight:2.5}).addTo(map);
  p.bindPopup(popup(z));
  p.on('click',()=>select(z.id,false));
  layers[z.id]=p;
 });
}
function clearV(){verts.splice(0).forEach(m=>map.removeLayer(m));}
function vertsDraw(){
 clearV(); if(!edit) return;
 const z=zones.find(x=>x.id===active); if(!z) return;
 z.polygon.forEach((pt,i)=>{
  const m=L.marker(pt,{draggable:true,icon:L.divIcon({html:'<div style="width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #0f766e"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:2000}).addTo(map);
  m.on('drag',e=>{z.polygon[i]=[e.latlng.lat,e.latlng.lng]; layers[z.id].setLatLngs(z.polygon);});
  m.on('dragend',()=>setStatus('حرّكت نقطة في '+z.short+' — اضغط حفظ'));
  verts.push(m);
 });
}
function select(id,fly){
 active=id;
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
 const z=zones.find(x=>x.id===id);
 if(fly) map.fitBounds(L.polygon(z.polygon).getBounds(),{padding:[40,40],maxZoom:17});
 vertsDraw();
}
function chips(){
 document.getElementById('chips').innerHTML=zones.map(z=>'<button class="chip '+(z.id===active?'active':'')+'" data-id="'+z.id+'">'+z.short+'</button>').join('');
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>select(b.dataset.id,true));
}
function setStatus(t){document.getElementById('status').textContent=t;}
document.getElementById('editBtn').onclick=()=>{
 edit=!edit;
 const b=document.getElementById('editBtn');
 b.textContent=edit?'تعديل: مفتوح':'تعديل: مغلق';
 b.className='btn '+(edit?'on':'off');
 if(edit&&!satOn) document.getElementById('satBtn').click();
 vertsDraw();
 setStatus(edit?'اسحب النقاط البيضاء على سياج المجمع':'وضع التعديل مغلق');
};
document.getElementById('satBtn').onclick=()=>{
 satOn=!satOn;
 const b=document.getElementById('satBtn');
 b.textContent=satOn?'الشوارع':'صور الأقمار';
 b.className='btn '+(satOn?'on':'off');
 if(satOn){map.removeLayer(streets);sat.addTo(map);} else {map.removeLayer(sat);streets.addTo(map);}
};
document.getElementById('saveBtn').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(zones)); setStatus('تم الحفظ على هذا الجهاز');
};
document.getElementById('resetBtn').onclick=()=>{
 if(!confirm('إعادة الحدود الأصلية؟')) return;
 zones=JSON.parse(JSON.stringify(base)); localStorage.removeItem(KEY); draw(); vertsDraw(); setStatus('عادت الحدود الأصلية');
};
draw(); chips();
const bb=L.latLngBounds([clinic]); zones.forEach(z=>z.polygon.forEach(p=>bb.extend(p)));
map.fitBounds(bb,{padding:[30,30]});
select('mamsha',false);
</script>
</body>
</html>
